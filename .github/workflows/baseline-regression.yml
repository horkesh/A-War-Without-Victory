name: Baseline Regression

# ALWAYS-REPORT path-filter shim (2026-06-09, task #81): the `test` and
# `scenario-anchors` jobs are REQUIRED status checks in branch protection. A
# workflow- or job-level `paths:` filter on a REQUIRED check that NEVER REPORTS on a
# non-matching PR jams that PR forever on a "pending" required check (the classic
# "required + path-filtered" gotcha). So we do NOT filter at the workflow level.
# Instead the workflow ALWAYS triggers, each job ALWAYS reports its check name, and a
# per-job changed-files detection step short-circuits the HEAVY steps to a fast no-op
# (success in seconds) when the PR touches no relevant paths:
#   - `test`             gates on the CODE path set (identical to full-suite — coverage
#                        does not shrink vs the full-vitest gate).
#   - `scenario-anchors` gates on the SIM/scenario path set (anchor-moving surfaces).
# `typecheck` is intentionally LEFT ALWAYS-RUN (fast ~1-2 min, broad type signal) and
# is the `needs:` parent for the gated jobs, so their check names always report even
# when their heavy steps short-circuit. See .github/scripts/detect-changed-paths.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
      - run: npm install --legacy-peer-deps --prefix src/ui/map

      - run: npx tsc --noEmit

  scenario-anchors:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          # detect-changed-paths.sh needs the base commit in history.
          fetch-depth: 0

      # Always-report shim: decide whether the heavy anchor run executes. The job
      # itself always completes (and reports the `scenario-anchors` check).
      # INTEGRITY (task #346): run a TRUSTED (base-branch) copy of the detection
      # script, not the PR's working copy, so a PR cannot edit detect-changed-paths.sh
      # to force relevant=false and bypass this REQUIRED gate. See the restore comment
      # in full-suite-and-fingerprint.yml.
      - name: Detect sim/scenario changes
        id: changes
        env:
          PATH_SET: sim
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            base_ref="${GITHUB_BASE_REF:-main}"
            git fetch --no-tags origin "${base_ref}:refs/remotes/origin/${base_ref}" >/dev/null 2>&1 || \
              git fetch --no-tags origin "${base_ref}" >/dev/null 2>&1 || true
            git checkout "origin/${base_ref}" -- .github/scripts/detect-changed-paths.sh
          fi
          bash .github/scripts/detect-changed-paths.sh

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
        if: steps.changes.outputs.relevant == 'true'
      - run: npm install --legacy-peer-deps --prefix src/ui/map
        if: steps.changes.outputs.relevant == 'true'

      - name: Rebuild startup snapshot for this platform
        if: steps.changes.outputs.relevant == 'true'
        run: npm run desktop:startup-snapshot:build

      - name: Focused scenario anchor tests
        if: steps.changes.outputs.relevant == 'true'
        run: npm run test:vitest:scenario:anchors

      - name: No sim/scenario changes — anchor tests skipped (green-fast)
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No src/sim, src/state, src/scenario, data/scenarios or data/calibration changes — scenario anchor tests skipped. Job reports success so branch protection stays unblocked."

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # tests/release_notes_generator.test.ts uses HEAD~5..HEAD git ranges
          # which require full history. Default fetch-depth=1 (shallow clone)
          # makes the generator's git log fail with "ambiguous argument 'HEAD~5..HEAD'".
          # detect-changed-paths.sh also needs the base commit in history.
          fetch-depth: 0

      # Always-report shim: decide whether the heavy fast-vitest slice runs. The job
      # itself always completes (and reports the `test` check) regardless of this
      # output. CODE path set is identical to the full-suite gate — coverage does not
      # shrink vs the full-vitest gate.
      - name: Detect calibration/code-contract changes
        id: changes
        env:
          PATH_SET: code
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            base_ref="${GITHUB_BASE_REF:-main}"
            git fetch --no-tags origin "${base_ref}:refs/remotes/origin/${base_ref}" >/dev/null 2>&1 || \
              git fetch --no-tags origin "${base_ref}" >/dev/null 2>&1 || true
            git checkout "origin/${base_ref}" -- .github/scripts/detect-changed-paths.sh
          fi
          bash .github/scripts/detect-changed-paths.sh

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
        if: steps.changes.outputs.relevant == 'true'
      - run: npm install --legacy-peer-deps --prefix src/ui/map
        if: steps.changes.outputs.relevant == 'true'

      - name: Rebuild startup snapshot for this platform
        if: steps.changes.outputs.relevant == 'true'
        run: npm run desktop:startup-snapshot:build

      - name: Fast unit tests
        if: steps.changes.outputs.relevant == 'true'
        run: npm run test:vitest:fast

      - name: No relevant changes — fast tests skipped (green-fast)
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No src/tools/tests/scenario/calibration/scripts/config changes — fast vitest slice skipped. Job reports success so branch protection stays unblocked."

  # `scenarios` is NOT a required check, but it `needs: test` and runs the heavy
  # scenario slice — leaving it un-gated would re-introduce a multi-minute cost on
  # doc-only PRs that the `test` gate was just shaved off of. Same SIM path set as
  # scenario-anchors; no coverage shrink on code PRs.
  scenarios:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # detect-changed-paths.sh needs the base commit in history.
          fetch-depth: 0

      - name: Detect sim/scenario changes
        id: changes
        env:
          PATH_SET: sim
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            base_ref="${GITHUB_BASE_REF:-main}"
            git fetch --no-tags origin "${base_ref}:refs/remotes/origin/${base_ref}" >/dev/null 2>&1 || \
              git fetch --no-tags origin "${base_ref}" >/dev/null 2>&1 || true
            git checkout "origin/${base_ref}" -- .github/scripts/detect-changed-paths.sh
          fi
          bash .github/scripts/detect-changed-paths.sh

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
        if: steps.changes.outputs.relevant == 'true'
      - run: npm install --legacy-peer-deps --prefix src/ui/map
        if: steps.changes.outputs.relevant == 'true'

      - name: Rebuild startup snapshot for this platform
        if: steps.changes.outputs.relevant == 'true'
        run: npm run desktop:startup-snapshot:build

      - name: Scenario tests
        if: steps.changes.outputs.relevant == 'true'
        run: npm run test:vitest:scenario

      - name: No sim/scenario changes — scenario tests skipped (green-fast)
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No src/sim, src/state, src/scenario, data/scenarios or data/calibration changes — scenario tests skipped."

  # engine-health-188w (2026-06-11, EH-1 Part B): ADVISORY (continue-on-error) 188w
  # engine-health gate. Runs a fresh 188w scenario, resolves the runner's printed
  # `outDir:`, and asserts the state-integrity + casualty-health thresholds in
  # data/calibration/engine_health_thresholds.json (188w band already seeded) via
  # tools/engine_health_gate.cjs. The gate exits 1 on a HARD regression
  # (stranded/zero-eligible/dead ops, ghost-destroyed, consistency, matched_osids floor);
  # `continue-on-error: true` turns that into a YELLOW (advisory) result, not a RED gate —
  # this is NOT a required check. Panel verdict GO; SIM-path-gated with the always-report
  # shim so it stays a fast green no-op on non-sim PRs (same path set as `scenarios`).
  engine-health-188w:
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # REQUIRED (promoted from advisory 2026-06-13, owner-authorized): a hard
    # engine-health regression at 188w (matched_osids < 658, stranded/dead-op/ghost
    # ceilings, K:W band) fails this job RED and blocks merge. The 3-5-clean-cycle
    # criterion was met (#424/#426/#427/#428/#429 all green). Path-gated: non-sim PRs
    # report success via the always-report shim, so only sim-touching PRs pay the run.
    steps:
      - uses: actions/checkout@v5
        with:
          # detect-changed-paths.sh needs the base commit in history.
          fetch-depth: 0

      # Always-report shim: decide whether the heavy 188w run executes. The job itself
      # always completes (and reports the `engine-health-188w` check). INTEGRITY: run a
      # TRUSTED (base-branch) copy of the detection script, not the PR's working copy.
      - name: Detect sim/scenario changes
        id: changes
        env:
          PATH_SET: sim
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            base_ref="${GITHUB_BASE_REF:-main}"
            git fetch --no-tags origin "${base_ref}:refs/remotes/origin/${base_ref}" >/dev/null 2>&1 || \
              git fetch --no-tags origin "${base_ref}" >/dev/null 2>&1 || true
            git checkout "origin/${base_ref}" -- .github/scripts/detect-changed-paths.sh
          fi
          bash .github/scripts/detect-changed-paths.sh

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
        if: steps.changes.outputs.relevant == 'true'
      - run: npm install --legacy-peer-deps --prefix src/ui/map
        if: steps.changes.outputs.relevant == 'true'

      - name: Rebuild startup snapshot for this platform
        if: steps.changes.outputs.relevant == 'true'
        run: npm run desktop:startup-snapshot:build

      - name: Fresh 188w run + engine-health gate (advisory)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          # Run the 188w scenario into a dedicated CI out-root; the preflight runner
          # prints `outDir: <path>` to stdout (the same contract ci_structural_fingerprint
          # relies on). Capture stdout, parse the LAST outDir line, and feed THAT dir to
          # the gate. The runner writes runs/eh_ci/apr1992_definitive_188w__<hash>__w188/.
          npm run sim:scenario:run:188w -- --out runs/eh_ci | tee /tmp/eh_188w_run.log
          out_dir="$(grep -oE '^outDir:[[:space:]]*.+$' /tmp/eh_188w_run.log | tail -n1 | sed -E 's/^outDir:[[:space:]]*//')"
          if [[ -z "${out_dir}" ]]; then
            echo "Could not parse 'outDir:' from runner stdout; falling back to glob." >&2
            out_dir="$(ls -1d runs/eh_ci/apr1992_definitive_188w__*__w188 2>/dev/null | tail -n1)"
          fi
          if [[ -z "${out_dir}" || ! -f "${out_dir}/run_summary.json" ]]; then
            echo "Resolved 188w out-dir '${out_dir}' has no run_summary.json" >&2
            exit 1
          fi
          echo "Resolved 188w out-dir: ${out_dir}"
          # REQUIRED: a hard engine-health regression here exits 1 and FAILS the job
          # (no continue-on-error). A deliberate threshold move re-blesses via
          # `node tools/engine_health_gate.cjs <run> --horizon 188w --update` in the PR.
          node tools/engine_health_gate.cjs "${out_dir}" --horizon 188w --json

      - name: No sim/scenario changes — engine-health gate skipped (green-fast)
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No src/sim, src/state, src/scenario, data/scenarios or data/calibration changes — 188w engine-health gate skipped."

  # baselines job removed 2026-05-04: byte-hash baseline comparison is
  # platform-bound (run_summary.json hashes diverge between Windows dev and
  # Linux CI). Vitest variant of this check (tests/scenario_golden_baselines_h2_3.test.ts)
  # is also test.skip'd. Regression detection signal preserved in
  # tests/integration_run_summary.test.ts, tests/integration_deployment_health.test.ts,
  # tests/scenario_harness_contracts.test.ts, and per-anchor controller checks.
  #
  # SUPERSEDED 2026-06-09 (C1): the platform-stable structural fingerprint that the
  # LANE-NIGHTSHIFT-PLATFORM-STABLE-MANIFEST follow-up called for now lives in the
  # dedicated `full-suite-and-fingerprint.yml` workflow (path-aware required gate),
  # together with the full-vitest-suite gate that closes the stale-pin false-green.
