name: Baseline Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
      - run: npm install --legacy-peer-deps --prefix src/ui/map

      - run: npx tsc --noEmit

  scenario-anchors:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
      - run: npm install --legacy-peer-deps --prefix src/ui/map

      - name: Rebuild startup snapshot for this platform
        run: npm run desktop:startup-snapshot:build

      - name: Focused scenario anchor tests
        run: npm run test:vitest:scenario:anchors

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # tests/release_notes_generator.test.ts uses HEAD~5..HEAD git ranges
          # which require full history. Default fetch-depth=1 (shallow clone)
          # makes the generator's git log fail with "ambiguous argument 'HEAD~5..HEAD'".
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
      - run: npm install --legacy-peer-deps --prefix src/ui/map

      - name: Rebuild startup snapshot for this platform
        run: npm run desktop:startup-snapshot:build

      - name: Fast unit tests
        run: npm run test:vitest:fast

  scenarios:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
      - run: npm install --legacy-peer-deps --prefix src/ui/map

      - name: Rebuild startup snapshot for this platform
        run: npm run desktop:startup-snapshot:build

      - name: Scenario tests
        run: npm run test:vitest:scenario

  # baselines job removed 2026-05-04: byte-hash baseline comparison is
  # platform-bound (run_summary.json hashes diverge between Windows dev and
  # Linux CI). Vitest variant of this check (tests/scenario_golden_baselines_h2_3.test.ts)
  # is also test.skip'd. Regression detection signal preserved in
  # tests/integration_run_summary.test.ts, tests/integration_deployment_health.test.ts,
  # tests/scenario_harness_contracts.test.ts, and per-anchor controller checks.
  #
  # SUPERSEDED 2026-06-09 (C1): the platform-stable structural fingerprint that the
  # LANE-NIGHTSHIFT-PLATFORM-STABLE-MANIFEST follow-up called for now lives in the
  # dedicated `full-suite-and-fingerprint.yml` workflow (path-aware required gate),
  # together with the full-vitest-suite gate that closes the stale-pin false-green.
