name: Full Suite + Structural Fingerprint

# C1 (2026-06-09): closes the stale-pin false-green leak and replaces the byte-hash
# baselines job (removed 2026-05-04 for Win/Linux platform divergence;
# LANE-NIGHTSHIFT-PLATFORM-STABLE-MANIFEST).
#
# ALWAYS-REPORT shim (2026-06-09, task #76): these two jobs (full-suite,
# structural-fingerprint) are intended to be REQUIRED status checks in branch
# protection. A workflow-level `paths:` filter (the original PR #343 design) makes a
# REQUIRED check that NEVER REPORTS on a PR that doesn't match the paths — GitHub then
# blocks that PR forever on a "pending" required check (the classic
# "required + path-filtered" gotcha). So we do NOT filter at the workflow level.
# Instead the workflow ALWAYS triggers on PRs to main (and the existing main pushes),
# each job ALWAYS reports its check name, and a per-job changed-files detection step
# short-circuits the HEAVY steps to a fast no-op (success in seconds) when the PR
# touches no calibration/code-contract paths. Result: green-fast on doc-only PRs,
# full-run on code PRs — safe to mark both checks REQUIRED without jamming doc PRs.
#
# The detected path set below is IDENTICAL to the old workflow-level `paths:` filter
# (src, tools, tests, data/scenarios, data/calibration, scripts, package.json,
# vitest.config.ts, tsconfig.json, plus this workflow file) so coverage does not shrink.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The single gate that runs the COMPLETE vitest suite (`npm run test:vitest` ==
  # `vitest run` over vitest.config.ts == ALL discovered vitest files), NOT a slice.
  #
  # WHY: the Baseline Regression `test` job runs only the `fast` slice and `scenarios`
  # runs only the `scenario` slice. Slice membership is decided by
  # tools/test/discover_test_files.mjs heuristics, so a test those heuristics MIS-BUCKET
  # or fail to discover can silently drop from BOTH slices with no machine signal. This
  # job runs everything the config discovers, so full-suite-only pins
  # (strict_null_inventory_progress, war_phase_step_order, consequence/substrate
  # inventory) can NO LONGER reach main green. fetch-depth: 0 because the suite includes
  # release_notes_generator.test.ts (HEAD~5..HEAD git range) AND the changed-files
  # detection step needs the base commit in history.
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Always-report shim: decide whether the heavy step runs. The job itself always
      # completes (and reports the `full-suite` check) regardless of this output.
      #
      # INTEGRITY (task #346): the skip decision must run a TRUSTED copy of the
      # detection logic, NOT the PR's working-copy script — otherwise a PR could edit
      # detect-full-suite-changes.sh to always emit relevant=false and BYPASS this
      # REQUIRED gate. On pull_request we therefore restore the script from the base
      # branch (origin/$GITHUB_BASE_REF) before running it, so a PR-controlled edit to
      # the script has NO effect on whether the required heavy steps run. (On push to
      # main the checked-out copy already IS the trusted base, so no restore needed.)
      - name: Detect calibration/code-contract changes
        id: changes
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            base_ref="${GITHUB_BASE_REF:-main}"
            git fetch --no-tags origin "${base_ref}:refs/remotes/origin/${base_ref}" >/dev/null 2>&1 || \
              git fetch --no-tags origin "${base_ref}" >/dev/null 2>&1 || true
            # Restore the trusted (base-branch) skip-decision script over the PR copy.
            git checkout "origin/${base_ref}" -- .github/scripts/detect-full-suite-changes.sh
          fi
          bash .github/scripts/detect-full-suite-changes.sh

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
        if: steps.changes.outputs.relevant == 'true'
      - run: npm install --legacy-peer-deps --prefix src/ui/map
        if: steps.changes.outputs.relevant == 'true'

      - name: Rebuild startup snapshot for this platform
        if: steps.changes.outputs.relevant == 'true'
        run: npm run desktop:startup-snapshot:build

      - name: Full vitest suite (all slices — no stale pin can hide)
        if: steps.changes.outputs.relevant == 'true'
        run: npm run test:vitest

      - name: First-hour browser gate
        if: steps.changes.outputs.relevant == 'true'
        run: npm run qa:first-hour:browser

      - name: Live surface browser gate
        if: steps.changes.outputs.relevant == 'true'
        run: npm run qa:live-surface:browser

      - name: No relevant changes — full suite skipped (green-fast)
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No src/tools/tests/scenario/calibration/scripts/config changes — full vitest suite skipped. Job reports success so branch protection stays unblocked."

  # Platform-stable structural fingerprint — the determinism regression signal that
  # replaces the removed byte-hash baselines job. Fingerprints only MEANINGFUL,
  # platform-stable fields (per-faction OSID control map + anchor pass/fail + bot
  # benchmark tallies — all integers/strings/booleans, verified identical across
  # same-territory runs) of a fresh 40w run and compares against the committed expected
  # (data/calibration/structural_fingerprint_40w.json). A structural move without a
  # deliberate `npm run ci:structural-fingerprint:update` fails the gate.
  #
  # Reference platform = Linux/Node 22 (DoD C2). Windows==Linux byte-hashes are NOT
  # promised — the OLD byte-hash baseline diverged by platform float serialization and
  # was removed for exactly that reason. The STRUCTURAL fields here ARE platform-stable
  # by construction; this job is the determinism authority on the reference platform.
  structural-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Always-report shim (see full-suite job): the job always reports the
      # `structural-fingerprint` check; only the fresh-40w compare is gated.
      #
      # INTEGRITY (task #354 followup): like the full-suite job, the skip decision
      # must run a TRUSTED (base-branch) copy of the detection script, NOT the PR's
      # working-copy script — otherwise a PR could edit detect-full-suite-changes.sh
      # to always emit relevant=false and BYPASS this REQUIRED gate. On pull_request
      # we restore the script from origin/$GITHUB_BASE_REF before running it. (On push
      # to main the checked-out copy already IS the trusted base, so no restore needed.)
      - name: Detect calibration/code-contract changes
        id: changes
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            base_ref="${GITHUB_BASE_REF:-main}"
            git fetch --no-tags origin "${base_ref}:refs/remotes/origin/${base_ref}" >/dev/null 2>&1 || \
              git fetch --no-tags origin "${base_ref}" >/dev/null 2>&1 || true
            # Restore the trusted (base-branch) skip-decision script over the PR copy.
            git checkout "origin/${base_ref}" -- .github/scripts/detect-full-suite-changes.sh
          fi
          bash .github/scripts/detect-full-suite-changes.sh

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
        if: steps.changes.outputs.relevant == 'true'
      - run: npm install --legacy-peer-deps --prefix src/ui/map
        if: steps.changes.outputs.relevant == 'true'

      - name: Rebuild startup snapshot for this platform
        if: steps.changes.outputs.relevant == 'true'
        run: npm run desktop:startup-snapshot:build

      - name: Fresh 40w run + structural-fingerprint compare
        if: steps.changes.outputs.relevant == 'true'
        run: npm run ci:structural-fingerprint:check

      - name: No relevant changes — fingerprint compare skipped (green-fast)
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No src/tools/tests/scenario/calibration/scripts/config changes — structural fingerprint compare skipped. Job reports success so branch protection stays unblocked."
