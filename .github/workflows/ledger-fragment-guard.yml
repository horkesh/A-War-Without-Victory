name: Ledger Fragment Guard

# No-op until 1.0. The project ledger and its fragments moved out of the repo to the
# coordination folder (owner ruling 2026-11-18). The job name `ledger-fragment` is kept so
# branch protection needs no change. tools/ledger_fragment_check.cjs stays for the 1.0
# consolidation but is not run.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  ledger-fragment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ledger fragment check retired
        run: echo "ledger moved out of the repo until 1.0 (owner 2026-11-18)"
