<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settlement Merger — AWWV</title>
  <link rel="stylesheet" href="./styles_hoi.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #1a1816; color: #d4c9a8; }

    #merger-root {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      font-family: 'Courier New', monospace;
    }

    /* ── Toolbar ── */
    .merger-toolbar {
      flex-shrink: 0; height: 40px;
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px;
      background: #2a2622;
      border-bottom: 1px solid #3d3729;
      font-size: 13px;
    }
    .merger-toolbar-title {
      font-weight: 700; color: #c4a44a; letter-spacing: 1px; font-size: 14px;
    }

    /* ── Main area ── */
    .merger-main {
      flex: 1; display: flex; overflow: hidden;
    }
    .merger-canvas-wrap {
      flex: 1; position: relative; overflow: hidden;
      background: #15130f;
      cursor: crosshair;
    }
    .merger-canvas-wrap canvas {
      display: block; position: absolute; inset: 0;
    }

    /* ── Tooltip ── */
    #merger-tooltip {
      position: fixed; display: none;
      background: rgba(30, 27, 22, 0.95); color: #d4c9a8;
      border: 1px solid #5a5040; border-radius: 3px;
      padding: 6px 10px; font-size: 11px; line-height: 1.5;
      pointer-events: none; z-index: 100; max-width: 280px;
      font-family: 'Courier New', monospace;
    }

    /* ── Sidebar ── */
    .merger-sidebar {
      width: 360px; flex-shrink: 0;
      background: #222018;
      border-left: 1px solid #3d3729;
      overflow-y: auto;
      font-size: 11px;
    }

    /* ── Status bar ── */
    .merger-status {
      flex-shrink: 0; height: 26px;
      display: flex; align-items: center;
      padding: 0 16px;
      background: #2a2622;
      border-top: 1px solid #3d3729;
      font-size: 11px; color: #8a8068;
    }

    /* ── Sidebar elements ── */
    .ms-section {
      padding: 8px 12px;
      border-bottom: 1px solid #3d3729;
    }
    .ms-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      color: #8a8068; letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .ms-select {
      width: 100%; padding: 4px 6px;
      background: #1a1816; color: #d4c9a8; border: 1px solid #3d3729;
      font-family: 'Courier New', monospace; font-size: 11px;
      border-radius: 2px;
    }
    .ms-radio-group {
      display: flex; gap: 12px;
    }
    .ms-radio-group label {
      display: flex; align-items: center; gap: 4px;
      cursor: pointer; font-size: 11px;
    }

    /* Selection list */
    .ms-sel-list {
      max-height: 160px; overflow-y: auto;
      margin: 4px 0;
    }
    .ms-sel-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 2px 0; font-size: 11px;
    }
    .ms-sel-item-name { color: #d4c9a8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .ms-sel-remove {
      cursor: pointer; color: #8a6040; font-weight: bold; padding: 0 4px;
      border: none; background: none; font-size: 13px;
    }
    .ms-sel-remove:hover { color: #c4a44a; }

    /* Ethnic bar */
    .ms-ethnic-bar {
      height: 18px; display: flex; border-radius: 2px; overflow: hidden;
      margin: 4px 0; border: 1px solid #3d3729;
    }
    .ms-ethnic-bar > div {
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 600; color: #fff; min-width: 0;
      overflow: hidden; white-space: nowrap;
    }
    .ms-ethnic-bar .eb-b { background: #41913f; }
    .ms-ethnic-bar .eb-s { background: #b23c3c; }
    .ms-ethnic-bar .eb-c { background: #3773af; }
    .ms-ethnic-bar .eb-o { background: #706858; }

    .ms-stats-row {
      display: flex; justify-content: space-between; padding: 1px 0; font-size: 11px;
    }
    .ms-stats-label { color: #8a8068; }
    .ms-stats-value { color: #d4c9a8; font-weight: 600; }

    .ms-ethnic-badge {
      display: inline-block; padding: 1px 6px; border-radius: 2px;
      font-size: 10px; font-weight: 700; color: #fff;
    }
    .ms-ethnic-badge.eb-B, .ms-ethnic-badge.eb-Bm { background: #41913f; }
    .ms-ethnic-badge.eb-S, .ms-ethnic-badge.eb-Sm { background: #b23c3c; }
    .ms-ethnic-badge.eb-C, .ms-ethnic-badge.eb-Cm { background: #3773af; }
    .ms-ethnic-badge.eb-X { background: #706858; }

    .ms-warning {
      color: #c4a44a; font-size: 10px; padding: 2px 0;
    }
    .ms-group-warn {
      color: #c4a44a; font-size: 11px; margin-left: 4px; flex-shrink: 0; cursor: help;
    }
    .ms-group-warn-crossmun {
      color: #e05050; font-size: 12px; margin-left: 4px; flex-shrink: 0; cursor: help;
      font-weight: 700;
    }
    .ms-group-card.ms-crossmun {
      border-color: #c44a4a; background: #2a1818;
    }
    .ms-group-card.ms-crossmun:hover { border-color: #e05050; }
    .ms-warning-crossmun {
      color: #e05050; font-size: 10px; padding: 2px 0; font-weight: 700;
    }
    .ms-footer-warn {
      color: #c4a44a;
    }
    .ms-footer-warn-crossmun {
      color: #e05050; font-weight: 700;
    }

    /* Buttons */
    .ms-btn {
      padding: 5px 12px; border: 1px solid #3d3729; border-radius: 2px;
      background: #2a2622; color: #d4c9a8; cursor: pointer;
      font-family: 'Courier New', monospace; font-size: 11px;
      transition: background 0.15s;
    }
    .ms-btn:hover { background: #3d3729; }
    .ms-btn:disabled { opacity: 0.4; cursor: default; }
    .ms-btn-primary {
      background: #4a6a2a; border-color: #5a8a3a; color: #fff;
    }
    .ms-btn-primary:hover { background: #5a8a3a; }
    .ms-btn-primary:disabled { background: #2a3a1a; border-color: #3a4a2a; }
    .ms-btn-danger { color: #c44a4a; }
    .ms-btn-danger:hover { background: #3a2222; }
    .ms-btn-row {
      display: flex; gap: 8px; margin-top: 6px;
    }

    /* Merge groups list */
    .ms-group-card {
      padding: 6px 8px; margin: 4px 0;
      background: #1a1816; border: 1px solid #3d3729; border-radius: 2px;
      cursor: pointer;
    }
    .ms-group-card:hover { border-color: #5a5040; }
    .ms-group-header {
      display: flex; align-items: center; gap: 6px; font-size: 11px;
    }
    .ms-group-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .ms-group-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ms-group-pop { color: #8a8068; font-size: 10px; }
    .ms-group-detail {
      display: none; padding-top: 4px; font-size: 10px; color: #8a8068;
    }
    .ms-group-card.expanded .ms-group-detail { display: block; }
    .ms-group-members {
      max-height: 120px; overflow-y: auto; padding: 2px 0;
    }
    .ms-group-member-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1px 0; font-size: 10px;
    }
    .ms-group-member-row span {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .ms-hint {
      font-size: 10px; color: #6a8a4a; font-style: italic; padding: 3px 0;
    }

    /* Stats footer */
    .ms-footer-stats {
      display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 10px; color: #8a8068;
    }
    .ms-footer-stats strong { color: #d4c9a8; }

    /* Groups scrollable area */
    .ms-groups-scroll {
      max-height: 300px; overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="merger-root">
    <div class="merger-toolbar">
      <span class="merger-toolbar-title">SETTLEMENT MERGER</span>
      <span style="color:#8a8068">|</span>
      <span id="toolbar-info" style="color:#8a8068">Loading...</span>
    </div>
    <div class="merger-main">
      <div class="merger-canvas-wrap" id="merger-canvas-wrap"></div>
      <aside class="merger-sidebar" id="merger-sidebar"></aside>
    </div>
    <div class="merger-status" id="merger-status">Initializing...</div>
  </div>
  <div id="merger-tooltip"></div>
  <script type="module" src="./settlement_merger.ts"></script>
</body>
</html>
