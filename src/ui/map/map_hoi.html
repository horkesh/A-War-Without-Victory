<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map HoI — AWWV</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%231c1a17' width='32' height='32'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23c4a35a'>H</text></svg>">
  <link rel="stylesheet" href="./styles_hoi.css">
</head>
<body>
  <div id="map-hoi-root">
    <!-- Top command bar -->
    <header class="hoi-top-bar" id="hoi-top-bar" role="banner">
      <div class="hoi-top-bar-faction" id="hoi-top-bar-faction"></div>
      <div class="hoi-top-bar-center" id="hoi-top-bar-center"></div>
      <div class="hoi-top-bar-actions" id="hoi-top-bar-actions"></div>
    </header>

    <!-- Main content -->
    <div class="hoi-main">
      <!-- Left sidebar (Army / War Status / etc.) -->
      <aside class="hoi-sidebar" id="hoi-sidebar" role="complementary" aria-label="Army management">
        <div class="hoi-sidebar-tabs" id="hoi-sidebar-tabs"></div>
        <div class="hoi-sidebar-content" id="hoi-sidebar-content"></div>
      </aside>

      <!-- Map canvas area (placeholder in Phase 3) -->
      <div class="hoi-map-wrap" id="hoi-map-wrap">
        <div class="hoi-map-placeholder" id="hoi-map-placeholder" aria-label="Map view">
          <span>Map</span>
        </div>
      </div>
    </div>

    <!-- Bottom status strip -->
    <footer class="hoi-status-strip" id="hoi-status-strip" role="contentinfo">
      <div class="hoi-status-ticker" id="hoi-status-ticker"></div>
      <div class="hoi-status-alerts" id="hoi-status-alerts"></div>
      <div class="hoi-status-quickstats" id="hoi-status-quickstats"></div>
    </footer>
  </div>

  <input type="file" id="hoi-file-input" accept=".json" style="display:none">
  <script type="module" src="./map_hoi.ts"></script>
</body>
</html>
