# Task manifest — warroom whiteboard date and corkboard map
#
# Format and its provenance: docs/plans/tasks/FORMAT.md
# The executor never reads this file; tools/render_task_prompt.cjs renders it into the prose
# shape of TASK_TEMPLATE.md, which is what gets dispatched.

version: 2
owning_plan: docs/plans/2026-09-10-warroom-whiteboard-date-and-corkboard-map-design.md
base_commit: 8dc8614f1880c4275c9f21436646377c629e66f7
lane: R7
gate: R7-WARROOM-PRESENTATION

# Required, and may not be empty. A manifest that omitted this would read as though the whole
# plan were machine-executable.
not_delegable:
  - "Whether the date READS as hand-written. That is the owner's judgement about how the artefact
    feels, it is the entire point of the item, and no test encodes it."
  - "Choosing the occlusion geometry. It follows from the luminance survey and from what the room
    is meant to look like — design, not extraction."
  - "Amending any of the four tests the plan says must change. Amending an acceptance test IS the
    oracle, and the oracle is never delegated."

tasks:
  - id: WR01-T1-FONT-INVENTORY
    kind: extract
    status: done
    # DONE, 2026-09-11. The inventory returned 22 font declarations across the warroom surfaces,
    # every one of them IBM Plex — which is the finding the whole item rests on. The date was not
    # styled wrong; no handwriting face was bundled at all, so each of seven legibility fixes had
    # retreated further toward a UI font because there was nothing else to retreat to.
    #
    # Caveat 700 is now vendored and the date is written in it.
    edit: []
    # Exact files. `src/ui/map/styles` was listed here as a directory until the validator
    # rejected it — the same shape that cost three dispatches on T2. The dispatch that produced
    # this task's result had already been given these two files by hand, which is precisely the
    # guess a directory hides.
    read:
      - src/ui/map/components/PresidentialInbox.tsx
      - src/ui/map/styles/globals.css
      - src/ui/map/styles/typography.ts
    change: >
      Report every CSS font-family declaration and every @font-face src across the warroom
      surfaces, each with the exact declaration text and the file and line it appears on. Report
      what is written; do not judge whether a family is bundled or system-provided.
    fails_now: []
    must_not_break: []
    read_only_acceptance: >
      Every quoted declaration verified with: npm run local:verify-quotes -- <answer.json>
      --field quote --source-field file
    out_of_scope:
      - Changing any font, style or asset
      - The corkboard map, which is a separate task
    why_delegable: >
      Pure extraction from named files with verbatim quotes a script can check. The ledger records
      this as the strongest mode: 4 extract dispatches, 3 accepted, 0 rewritten.

  - id: WR01-T2-TEST-SITES
    kind: extract
    status: done
    # DONE WITHOUT A DISPATCH, and the reason is a format lesson.
    #
    # This task asked the executor to locate the tests that pin the date. The OWNING PLAN
    # already answers it: a table at :249-256 names all four sites with exact line ranges and
    # what each currently asserts, verified against the files.
    #
    # Two dispatches were spent before that was noticed. The first returned 4/4 VERIFIED quotes
    # from a test about army HQ timing copy -- faithful extraction from inputs I had chosen with
    # a truncated grep. The second, pointed at the right files, returned 6/6 verified quotes of
    # which one was a date assertion and five were hotspot and toolbar tests.
    #
    # ⇒ Before writing a task, check whether the owning plan already answers it. A task that
    #   duplicates the plan does not merely waste a dispatch: it invites a re-derivation that can
    #   DISAGREE with the plan, and then there are two answers and no authority.
    # ⇒ Quote verification proves PROVENANCE, not RELEVANCE. Both dispatches verified perfectly.
    edit: []
    read:
      - tests/ui/warroom_shell_accessibility.test.ts
      - tests/ui/warroom_scene_continuity.test.ts
    change: >
      Superseded by the owning plan's own table at :249-256, which names the four test sites with
      line ranges. Retained rather than deleted so the reasoning survives.
    fails_now: []
    must_not_break: []
    read_only_acceptance: >
      Settled by the owning plan at :249-256; lines 224-232 were checked against the file and
      match what the plan claims.
    out_of_scope:
      - Editing any test. Amending an acceptance test is the oracle.
    why_delegable: >
      It was not. The plan already held the answer, and the manifest should have cited it.

  - id: WR01-T3-LUMINANCE-TABLE
    kind: extract
    status: done
    # WAS BLOCKED ON A CLAIM THAT WAS SIMPLY FALSE, and that is the lesson worth keeping.
    #
    # The recorded reason was: "The 15 plate images are not tracked — only their manifest is — so
    # the evidence is not present in a fresh clone." All fifteen ARE tracked, and so are the three
    # regions files. `git ls-files src/ui/warroom/assets/` says so, and always did.
    #
    # ⇒ `blocked_by` is an unverified assertion. The validator checks that files NAMED in `read`
    #   and `edit` exist; a blocked task has neither, so nothing in the format can contradict its
    #   stated reason. This one sat unchallenged, and the work was later done anyway without
    #   anyone noticing the manifest still called it impossible.
    # ⇒ Before accepting a block, run the one command that would refute it. Here that was a single
    #   `git ls-files`.
    #
    # DONE, 2026-09-11: tools/derive_warroom_board_luminance.cjs measures the median CIE L* of the
    # wall_calendar_area region on all fifteen plates into
    # src/ui/warroom/assets/warroom_board_luminance.json. Range L*24.5 (HRHB 1995) to L*69.8
    # (RBiH 1995). It also corrected three figures in the owning plan.
    edit: []
    read:
      - src/ui/warroom/assets/hq_rbih_regions.json
      - src/ui/warroom/assets/hq_rs_regions.json
      - src/ui/warroom/assets/hq_hrhb_regions.json
    change: >
      Measure the whiteboard's lightness on every faction x year plate and commit it as data, so
      the overlay ink can be derived from the room's light rather than hard-coded per plate.
    fails_now: []
    must_not_break: []
    read_only_acceptance: >
      tests/ui/warroom_board_luminance.test.ts — the committed table must be reproduced
      byte-for-byte by its generating script, and its recorded source digest must still match the
      art it was derived from.
    out_of_scope:
      - Choosing the ink colour, which is design and follows from the table
      - The corkboard map overlay, which shares the table but is a separate step
    why_delegable: >
      It was not, and it was not delegated. Reading pixels needs a script, not a language model,
      and the acceptance test is the oracle.
