    kind: extract
    status: open
    edit: []
    read:
      - src/ui/map/components/PresidentialInbox.tsx
      - src/ui/map/styles
    change: >
      Report every CSS font-family declaration and every @font-face src across the warroom
      surfaces, each with the exact declaration text and the file and line it appears on. Report
      what is written; do not judge whether a family is bundled or system-provided.
    fails_now: []
    must_not_break: []
    read_only_acceptance: >
      Every quoted declaration verified with: npm run local:verify-quotes -- <answer.json>
      --field quote --source-field file
    out_of_scope:
      - Changing any font, style or asset
      - The corkboard map, which is a separate task
    why_delegable: >
      Pure extraction from named files with verbatim quotes a script can check. The ledger records
      this as the strongest mode: 4 extract dispatches, 3 accepted, 0 rewritten.

  - id: WR01-T2-TEST-SITES
    kind: extract
    status: done
    # DONE WITHOUT A DISPATCH, and the reason is a format lesson.
    #
    # This task asked the executor to locate the tests that pin the date. The OWNING PLAN
    # already answers it: a table at :249-256 names all four sites with exact line ranges and
    # what each currently asserts, verified against the files.
    #
    # Two dispatches were spent before that was noticed. The first returned 4/4 VERIFIED quotes
    # from a test about army HQ timing copy -- faithful extraction from inputs I had chosen with
    # a truncated grep. The second, pointed at the right files, returned 6/6 verified quotes of
    # which one was a date assertion and five were hotspot and toolbar tests.
    #
    # ⇒ Before writing a task, check whether the owning plan already answers it. A task that
    #   duplicates the plan does not merely waste a dispatch: it invites a re-derivation that can
    #   DISAGREE with the plan, and then there are two answers and no authority.
    # ⇒ Quote verification proves PROVENANCE, not RELEVANCE. Both dispatches verified perfectly.
    edit: []
    read:
      - tests/ui/warroom_shell_accessibility.test.ts
      - tests/ui/warroom_scene_continuity.test.ts
    change: >
      Superseded by the owning plan's own table at :249-256, which names the four test sites with
      line ranges. Retained rather than deleted so the reasoning survives.
    fails_now: []
    must_not_break: []
    read_only_acceptance: >
      Settled by the owning plan at :249-256; lines 224-232 were checked against the file and
      match what the plan claims.
    out_of_scope:
      - Editing any test. Amending an acceptance test is the oracle.
    why_delegable: >
      It was not. The plan already held the answer, and the manifest should have cited it.

