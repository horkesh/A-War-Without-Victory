# Open Gates Register
#
# PURPOSE
#   Answer "what is open right now?" as data rather than prose. Gate state currently
#   lives in paragraphs across MASTER_ROADMAP.md, COMMAND_BOARD.md and a 35k-line
#   PROJECT_LEDGER.md, where it can be read but not enumerated.
#
# AUTHORITY
#   This file does NOT outrank the roadmap. MASTER_ROADMAP.md remains the sole authority
#   for unfinished product work (its Section 5 register), and COMMAND_BOARD.md remains the
#   derived dispatch view. This register is a third, narrower thing: the list of named
#   gates and their evidence, in a form a test can check. If this file and the roadmap
#   disagree, the roadmap wins and this file is the one that gets corrected.
#
# WHY IT IS IN-REPO AND NOT AN EXTERNAL TRACKER
#   Every claim in this project travels with its receipt in the same commit. A gate whose
#   state lives outside git cannot be amended alongside the change that closes it, cannot
#   be panel-reviewed, and cannot be diffed. Drift between a prose record and reality has
#   already happened repeatedly here; a second out-of-repo copy would multiply it.
#
# RULES
#   - A gate is a NAMED thing with a NAMED piece of evidence that would close it.
#     If you cannot write `evidence_required` as an observable artifact, it is not a gate
#     yet — it is an intention, and it belongs in the owning plan instead.
#   - `status: closed` REQUIRES a non-null `evidence_path` that exists in the repo.
#   - `source` must point at the plan or report that owns the gate. It must exist.
#   - Lane sequencing (R8 waits on R7, R9 waits on R8) is the roadmap's to state, not
#     this file's. Use `blocks` to record the dependency, not to restate the sequence.
#
# VALIDATION
#   node tools/validate_open_gates.cjs      (also run by tests/open_gates_register.test.ts)
#   npm run gates                           prints the currently-open rows

