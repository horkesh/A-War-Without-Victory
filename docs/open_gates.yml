      STILL OPEN, AND THE FIGURE HERE WAS WRONG. This note previously read "160 of 244
      life-lessons entries carry a broken pointer". Measured 2026-09-11 with
      tools/validate_lesson_pointers.cjs the index carries 23 pointer lines of which 15 are
      broken, and at THIS gate's own commit it carried 20 in total — so 160 was never the
      number, in this file or any ancestor of it. The overstatement was not harmless: it turned
      a tractable cleanup into something that reads like a week of curation, which is a reliable
      way to ensure nobody starts it.
      The substance stands: those bodies only ever lived in the index, and routing them into
      topic files is a curation judgement rather than a mechanical move, so the 15 remain open.
      What is now mechanical — tools/lesson_pointer_baseline.json records them as a RATCHET, and
      tests/lesson_pointer_integrity.test.ts fails if a NEW broken pointer appears, or if a
      baseline entry quietly starts resolving without the list being trimmed. List them with
      `npm run lessons:pointers`.

